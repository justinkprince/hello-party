<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hello-party parts gallery</title>
    <style>
      body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: #f6f6f8; color: #222; }
      #app { max-width: 1200px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      h2 { font-size: 18px; margin: 28px 0 8px; }
      h3 { font-size: 14px; margin: 14px 0 6px; color: #555; }
      .note { color: #666; margin: 0 0 16px; }
      .small { font-size: 13px; color: #555; margin-top: 8px; }
      .top { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
      @media (max-width: 760px) { .top { grid-template-columns: 1fr; } }
      .stage { display: flex; align-items: flex-end; justify-content: center; height: 480px; padding-bottom: 24px;
        box-sizing: border-box; border-radius: 12px; border: 1px solid #ccc; background: #ffe3ee; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      button { font: inherit; padding: 6px 12px; border: 1px solid #999; border-radius: 6px; background: #fff; cursor: pointer; }
      button.on { background: #222; color: #fff; border-color: #222; }
      button.swatch { width: 34px; height: 34px; padding: 0; }
      .panel { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
      .panel label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
      .panel label.inline { flex-direction: row; align-items: center; gap: 8px; }
      select, input[type="color"] { font: inherit; width: 100%; box-sizing: border-box; }
      input[type="color"] { height: 34px; padding: 2px; }
      .tiles { display: flex; flex-wrap: wrap; gap: 8px; }
      .tile { width: 112px; padding: 14px 4px 6px; text-align: center; cursor: pointer; background: #fff;
        border: 2px solid transparent; border-radius: 8px; font-size: 12px; box-sizing: border-box; }
      .tile.sel { border-color: #e60012; }
      .tile-label { margin-top: 4px; overflow-wrap: anywhere; }
      pre { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; overflow: auto; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>

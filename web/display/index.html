<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hello-party display spike (throwaway)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe3ee; cursor: none; }
      #stage { position: fixed; inset: 0; }
      #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
      #hud {
        position: fixed; left: 8px; top: 8px; z-index: 10; padding: 8px 12px;
        background: rgba(0, 0, 0, 0.75); color: #fff; font: 18px/1.35 monospace; white-space: pre;
      }

      .kit { position: absolute; left: 0; top: 0; width: 140px; height: 196px; }
      .kit svg { display: block; overflow: visible; }
      .kit .bob { animation: bob 0.6s ease-in-out infinite alternate; animation-delay: var(--d); }
      .kit .head { transform-box: fill-box; transform-origin: 50% 100%;
        animation: nod 0.9s ease-in-out infinite alternate; animation-delay: var(--d); }
      .kit .arm { transform-box: fill-box; transform-origin: 50% 5%;
        animation: wave 0.5s ease-in-out infinite alternate; animation-delay: var(--d); }
      .kit .leg { transform-box: fill-box; transform-origin: 50% 0%;
        animation: step 0.5s ease-in-out infinite alternate; animation-delay: var(--d); }
      .kit .arm.r, .kit .leg.r { animation-direction: alternate-reverse; }
      .kit .bow { transform-box: fill-box; transform-origin: 50% 50%;
        animation: wig 0.7s ease-in-out infinite alternate; animation-delay: var(--d); }

      @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
      @keyframes nod { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
      @keyframes wave { from { transform: rotate(-25deg); } to { transform: rotate(25deg); } }
      @keyframes step { from { transform: rotate(-15deg); } to { transform: rotate(15deg); } }
      @keyframes wig { from { transform: scale(1); } to { transform: scale(1.12); } }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <canvas id="fx"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/spike.ts"></script>
  </body>
</html>
